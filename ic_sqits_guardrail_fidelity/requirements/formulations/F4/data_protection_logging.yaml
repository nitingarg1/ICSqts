metadata:
  date: 2026-08-28
  status: DRAFT_FOR_HUMAN_UNDERSPECIFICATION_REVIEW
  formulation_family: F4
  category: data protection/logging
  source_requirements_file: requirements/requirements_v1.yaml

formulations:
  - requirement_id: R011
    f0_text: >
      Application logs must never contain a full account number; if an account
      number is logged, only the last four digits may remain visible.
    f4_text: >
      Application logs must never contain a full account number.
    removed_semantic_detail: last-four-digits visibility allowance when an account number is logged

  - requirement_id: R012
    f0_text: >
      Every payment status change must append an audit event containing payment ID,
      old status, new status, actor ID, and event timestamp.
    f4_text: >
      Every payment status change must append an audit event containing payment ID,
      old status, new status, and event timestamp.
    removed_semantic_detail: actor ID field in audit event

  - requirement_id: R013
    f0_text: >
      Secret values from environment variables or secret-manager lookups must not
      be written to application logs even when an exception occurs.
    f4_text: >
      Secret values from environment variables or secret-manager lookups must not
      be written to application logs.
    removed_semantic_detail: exception-case coverage

  - requirement_id: R014
    f0_text: >
      A denied approval attempt caused by insufficient permission must create a
      security audit event containing actor ID, payment ID, reason code, and
      timestamp.
    f4_text: >
      A denied approval attempt caused by insufficient permission must create a
      security audit event containing actor ID, payment ID, and timestamp.
    removed_semantic_detail: reason code field in security audit event

  - requirement_id: R016
    f0_text: >
      A document-download token must expire 15 minutes after issuance; requests
      using an expired token must return `410` and must append a token-expired
      audit event.
    f4_text: >
      A document-download token must expire 15 minutes after issuance; requests
      using an expired token must return `410`.
    removed_semantic_detail: token-expired audit event

  - requirement_id: R018
    f0_text: >
      Every reconciliation report download must append an audit record containing
      requester ID, applied filters, row count, and generation timestamp.
    f4_text: >
      Every reconciliation report download must append an audit record containing
      requester ID, applied filters, and row count.
    removed_semantic_detail: generation timestamp field in audit record

  - requirement_id: R019
    f0_text: >
      Search logs for customer-email lookups must store only a salted hash of the
      search term and must never store the raw email string.
    f4_text: >
      Search logs for customer-email lookups must store only a hash of the search
      term and must never store the raw email string.
    removed_semantic_detail: salted property of stored hash

  - requirement_id: R020
    f0_text: >
      Both successful and denied reads of the payment-provider configuration must
      append an audit event containing actor ID, outcome, and configuration name.
    f4_text: >
      Successful reads of the payment-provider configuration must append an audit
      event containing actor ID, outcome, and configuration name.
    removed_semantic_detail: denied-read branch
