metadata:
  date: 2026-08-27
  status: FINAL_HUMAN_REVIEWED
  category: state transitions/business invariants
  source_requirements_file: requirements/requirements_v1.yaml

checklists:
  - requirement_id: R031
    review_status: FIX_TOO_STRONG
    requirement_text: >
      A payment may move from `DRAFT` to `SUBMITTED` only if it has at least one
      line item and the beneficiary record is verified.
    obligations:
      - obligation_id: R031_O1
        requirement_id: R031
        actor: payment transition workflow
        precondition: transition from `DRAFT` to `SUBMITTED` is requested
        action: verify payment has at least one line item
        expected_response_or_event: transition to `SUBMITTED` must not occur when payment has no line items
        required_state_effect: none required by text on rejection
        forbidden_state_effect: transition to `SUBMITTED` with no line items
        exception: none stated
        evidence_needed: payment state before and after request; payment line-item records; transition response
        why_this_obligation_is_required_by_the_text: Text conditions transition on at least one line item.
      - obligation_id: R031_O2
        requirement_id: R031
        actor: payment transition workflow
        precondition: transition from `DRAFT` to `SUBMITTED` is requested
        action: verify beneficiary record is verified
        expected_response_or_event: transition to `SUBMITTED` must not occur when beneficiary record is not verified
        required_state_effect: none required by text on rejection
        forbidden_state_effect: transition to `SUBMITTED` with unverified beneficiary
        exception: none stated
        evidence_needed: payment state before and after request; beneficiary verification record; transition response
        why_this_obligation_is_required_by_the_text: Text conditions transition on verified beneficiary record.

  - requirement_id: R032
    review_status: FIX_TOO_STRONG
    requirement_text: >
      A `SUBMITTED` payment may transition to `APPROVED` only after the required
      approver count for that payment type has been reached.
    obligations:
      - obligation_id: R032_O1
        requirement_id: R032
        actor: payment transition workflow
        precondition: transition from `SUBMITTED` to `APPROVED` is requested
        action: apply required approver count for that payment type as transition threshold
        expected_response_or_event: transition must not occur before payment-type approver count is reached
        required_state_effect: none required by text
        forbidden_state_effect: transition to `APPROVED` before required count for that payment type is reached
        exception: none stated
        evidence_needed: payment type; payment-type approver-count policy; approval history; payment state before and after request
        why_this_obligation_is_required_by_the_text: Text references required approver count for that payment type.
      - obligation_id: R032_O2
        requirement_id: R032
        actor: payment transition workflow
        precondition: transition from `SUBMITTED` to `APPROVED` is requested and required approver count for that payment type is known
        action: permit transition only after that count has been reached
        expected_response_or_event: transition to `APPROVED` does not occur when recorded approvals are below required count
        required_state_effect: none required by text on rejection
        forbidden_state_effect: transition to `APPROVED` before required count reached
        exception: none stated
        evidence_needed: approval history; transition response; payment state before and after request
        why_this_obligation_is_required_by_the_text: Text says payment may transition to `APPROVED` only after required approver count has been reached.

  - requirement_id: R033
    review_status: FIX_TOO_STRONG
    requirement_text: >
      Once a payment reaches `EXECUTED`, no mutable field except
      `reconciliation_note` may be changed.
    obligations:
      - obligation_id: R033_O1
        requirement_id: R033
        actor: update workflow
        precondition: payment is in `EXECUTED` state
        action: prevent changes to every mutable field other than `reconciliation_note`
        expected_response_or_event: every other mutable field remains unchanged
        required_state_effect: none required by text on rejection
        forbidden_state_effect: modifying other mutable fields after payment reaches `EXECUTED`
        exception: "`reconciliation_note`"
        evidence_needed: payment state; update payload; response; post-update record
        why_this_obligation_is_required_by_the_text: Text says no mutable field except `reconciliation_note` may be changed once payment reaches `EXECUTED`.

  - requirement_id: R034
    review_status: OK
    requirement_text: >
      Rejecting a payment must set status to `REJECTED` and clear any scheduled
      execution timestamp.
    obligations:
      - obligation_id: R034_O1
        requirement_id: R034
        actor: rejection workflow
        precondition: payment is rejected
        action: set payment status to `REJECTED`
        expected_response_or_event: payment record shows `REJECTED`
        required_state_effect: status becomes `REJECTED`
        forbidden_state_effect: rejected payment remaining in prior non-rejected state
        exception: none stated
        evidence_needed: payment record before and after rejection
        why_this_obligation_is_required_by_the_text: Text explicitly requires rejected payment status to be `REJECTED`.
      - obligation_id: R034_O2
        requirement_id: R034
        actor: rejection workflow
        precondition: payment is rejected and scheduled execution timestamp exists or may exist
        action: clear scheduled execution timestamp
        expected_response_or_event: scheduled execution timestamp is empty after rejection
        required_state_effect: scheduled execution timestamp cleared
        forbidden_state_effect: retaining scheduled execution timestamp after rejection
        exception: none stated
        evidence_needed: payment record before and after rejection
        why_this_obligation_is_required_by_the_text: Text explicitly requires clearing scheduled execution timestamp on rejection.

  - requirement_id: R036
    review_status: FIX_TOO_STRONG
    requirement_text: >
      A payment may be canceled only from `DRAFT` or `SUBMITTED`; a cancel request
      for `APPROVED` or `EXECUTED` must return `409` and leave status unchanged.
    obligations:
      - obligation_id: R036_O1
        requirement_id: R036
        actor: cancel workflow
        precondition: cancel request is submitted
        action: permit cancel only from `DRAFT` or `SUBMITTED`
        expected_response_or_event: cancel from allowed states may proceed
        required_state_effect: none beyond allowed cancel behavior
        forbidden_state_effect: cancel success from forbidden states
        exception: none stated
        evidence_needed: payment status; cancel response
        why_this_obligation_is_required_by_the_text: Text says payment may be canceled only from `DRAFT` or `SUBMITTED`.
      - obligation_id: R036_O2
        requirement_id: R036
        actor: cancel workflow
        precondition: cancel request is submitted while payment is `APPROVED` or `EXECUTED`
        action: return `409`
        expected_response_or_event: response code is `409`
        required_state_effect: none required by text beyond unchanged status
        forbidden_state_effect: returning a response code other than `409`
        exception: none stated
        evidence_needed: payment status; cancel response code
        why_this_obligation_is_required_by_the_text: Text explicitly requires `409` for cancel request in `APPROVED` or `EXECUTED`.
      - obligation_id: R036_O3
        requirement_id: R036
        actor: cancel workflow
        precondition: cancel request is submitted while payment is `APPROVED` or `EXECUTED`
        action: leave payment status unchanged
        expected_response_or_event: status after request matches prior status
        required_state_effect: payment status remains unchanged
        forbidden_state_effect: changing payment status in response to cancel request
        exception: none stated
        evidence_needed: payment state before and after request
        why_this_obligation_is_required_by_the_text: Text explicitly says forbidden cancel must leave status unchanged.

  - requirement_id: R037
    review_status: OK
    requirement_text: >
      If a delegation window expires while a delegated approval task is still
      pending, that delegated task must become invalid and an expiration event must
      be emitted.
    obligations:
      - obligation_id: R037_O1
        requirement_id: R037
        actor: delegation task management
        precondition: delegation window expires while delegated approval task is still pending
        action: mark delegated task invalid
        expected_response_or_event: task status becomes invalid after expiry
        required_state_effect: delegated task becomes invalid
        forbidden_state_effect: pending delegated task remaining valid after delegation expiry
        exception: none stated
        evidence_needed: delegation window record; task status before and after expiry
        why_this_obligation_is_required_by_the_text: Text says pending delegated task must become invalid when delegation window expires.
      - obligation_id: R037_O2
        requirement_id: R037
        actor: delegation task management
        precondition: delegation window expires while delegated approval task is still pending
        action: emit expiration event
        expected_response_or_event: expiration event appears in event log
        required_state_effect: expiration event emitted
        forbidden_state_effect: invalidation without expiration event
        exception: none stated
        evidence_needed: event log entry linked to task expiration
        why_this_obligation_is_required_by_the_text: Text explicitly requires expiration event to be emitted.

  - requirement_id: R038
    review_status: FIX_TOO_STRONG
    requirement_text: >
      Opening a chargeback on a captured payment must set `dispute_status` to
      `OPEN` and must block creation of further refunds until the dispute is
      resolved.
    obligations:
      - obligation_id: R038_O1
        requirement_id: R038
        actor: chargeback workflow
        precondition: chargeback is opened on a captured payment
        action: set `dispute_status` to `OPEN`
        expected_response_or_event: payment dispute status becomes `OPEN`
        required_state_effect: "`dispute_status` set to `OPEN`"
        forbidden_state_effect: chargeback opening without dispute status becoming `OPEN`
        exception: none stated
        evidence_needed: payment record before and after chargeback opening
        why_this_obligation_is_required_by_the_text: Text explicitly requires setting `dispute_status` to `OPEN`.
      - obligation_id: R038_O2
        requirement_id: R038
        actor: refund creation workflow
        precondition: dispute remains unresolved after chargeback opened
        action: block creation of further refunds
        expected_response_or_event: no further refund is created while dispute remains unresolved
        required_state_effect: none required by text on rejection
        forbidden_state_effect: creation of further refund during unresolved dispute
        exception: dispute resolution ends the block
        evidence_needed: chargeback record; dispute resolution state; refund-create outcome; refund records
        why_this_obligation_is_required_by_the_text: Text says further refunds must be blocked until dispute is resolved.

  - requirement_id: R040
    review_status: FIX_TOO_STRONG
    requirement_text: >
      A partially refunded payment must remain in `CAPTURED` status until the sum
      of approved refunds equals the captured amount; only then may status become
      `REFUNDED`.
    obligations:
      - obligation_id: R040_O1
        requirement_id: R040
        actor: payment status management
        precondition: approved refunds total is less than captured amount
        action: keep payment status as `CAPTURED`
        expected_response_or_event: payment remains `CAPTURED`
        required_state_effect: status remains `CAPTURED`
        forbidden_state_effect: changing status to `REFUNDED` before refund total reaches captured amount
        exception: none stated
        evidence_needed: captured amount; approved refund totals; payment status history
        why_this_obligation_is_required_by_the_text: Text says partially refunded payment must remain `CAPTURED` until approved refunds equal captured amount.
      - obligation_id: R040_O2
        requirement_id: R040
        actor: payment status management
        precondition: approved refunds total equals captured amount
        action: permit status to become `REFUNDED`
        expected_response_or_event: payment status may become `REFUNDED`
        required_state_effect: none required by text; equality permits but does not require transition
        forbidden_state_effect: none stated for equality case
        exception: none stated
        evidence_needed: captured amount; approved refund totals; payment status history
        why_this_obligation_is_required_by_the_text: Text says status may become `REFUNDED` only when approved refunds equal captured amount.
