metadata:
  date: 2026-08-27
  status: FROZEN_STEP_7_SELECTION
  benchmark_theme: service-oriented payment and approval workflow
  total_candidates: 60
  total_selected: 48
  category_counts:
    authorization/security: 8
    data protection/logging: 8
    validation/input constraints: 8
    state transitions/business invariants: 8
    reliability/idempotency: 8
    observability/audit: 8
  notes:
    - Selected from candidate_requirements.yaml during Step 7 human-guided curation.
    - All retained requirements preserve original source metadata and remain marked NEW_SYNTHETIC.
    - Selection balanced semantic richness, observable evidence, duplicate reduction, and benchmark variant potential.

requirements:
  - requirement_id: R001
    text: >
      A payment request may be approved only by a user with the `approver` role,
      and the user who submitted the request must not approve that same request.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Verify the acting user has the `approver` role.
      - Verify the acting user is not the original submitter of the payment request.
      - Reject the approval attempt if either check fails.
    candidate_evidence:
      - Approval endpoint response code and body.
      - Payment approval record showing actor identity.
      - Audit entry for approved or denied approval attempt.
    reason_it_is_in_scope: >
      Machine-checkable role and identity constraints with clear allow/deny behavior
      and audit evidence.

  - requirement_id: R002
    text: >
      A payment greater than 10000 USD may be released only after two distinct
      approvers have approved it, and at least one approver must hold the
      `finance_manager` role.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect whether payment amount exceeds 10000 USD.
      - Require two distinct approval actions before release.
      - Require at least one recorded approver to hold `finance_manager`.
      - Block release if any prerequisite is missing.
    candidate_evidence:
      - Payment record with amount and release status.
      - Approval history with approver identities and roles.
      - Release attempt response or execution log.
    reason_it_is_in_scope: >
      Multi-obligation authorization rule with threshold, cardinality, and role
      constraints.

  - requirement_id: R003
    text: >
      A payment may be voided only by its creator or by an `admin` user before
      settlement, and a successful void must set status to `VOIDED` and append a
      void audit event.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Allow void only for creator or `admin` actor.
      - Allow void only before settlement occurs.
      - Set payment status to `VOIDED` on success.
      - Append a void audit event on success.
    candidate_evidence:
      - Payment state before and after void request.
      - Actor identity and role in request context.
      - Audit stream entry for void action.
    reason_it_is_in_scope: >
      Combines actor authorization, temporal precondition, and explicit state and
      audit effects.

  - requirement_id: R004
    text: >
      If an approval request is made with an inactive session token, the system
      must return `401`, must not record an approval, and must not change payment
      state.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect inactive session token at approval time.
      - Return `401` for the request.
      - Prevent creation of any approval record.
      - Preserve existing payment state unchanged.
    candidate_evidence:
      - HTTP response code.
      - Approval table or event log.
      - Payment state snapshot before and after request.
    reason_it_is_in_scope: >
      Negative security rule with explicit non-mutation requirements and observable
      response semantics.

  - requirement_id: R005
    text: >
      A user with the `support_readonly` role may view payment summaries but must
      not see full account numbers, routing numbers, or approval comments marked
      confidential.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Allow summary read access for `support_readonly`.
      - Prevent exposure of full account numbers.
      - Prevent exposure of routing numbers.
      - Prevent exposure of confidential approval comments.
    candidate_evidence:
      - API response payload for support_readonly requests.
      - Field-level masking behavior in rendered response.
      - Access log showing request actor and endpoint.
    reason_it_is_in_scope: >
      Role-conditioned data exposure rule with multiple forbidden fields and clear
      payload evidence.

  - requirement_id: R007
    text: >
      An approval delegate may act for the original approver only during the
      configured delegation window, and the delegate must not create a further
      delegation from that temporary authority.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Permit delegated approval only while delegation window is active.
      - Associate delegated action with original approver context.
      - Reject any attempt by the delegate to create a chained delegation.
    candidate_evidence:
      - Delegation record with start and end timestamps.
      - Approval action log with delegate identity.
      - Delegation-create response for chained attempt.
    reason_it_is_in_scope: >
      Time-bounded authorization with exception-like temporary authority and
      explicit forbidden follow-on behavior.

  - requirement_id: R008
    text: >
      A settled payment may be reversed only by a user with the `treasury` role,
      and the reversal request must reference an existing incident ticket.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Verify payment is settled before reversal path applies.
      - Verify acting user has `treasury` role.
      - Require reference to an existing incident ticket.
      - Reject reversal if any required condition fails.
    candidate_evidence:
      - Payment settlement status.
      - User role at reversal time.
      - Incident ticket identifier lookup and response.
    reason_it_is_in_scope: >
      Authorization rule with state precondition and linked evidence requirement.

  - requirement_id: R010
    text: >
      A service account may create an internal transfer only when its mTLS client
      subject is on the approved allowlist; otherwise the request must be denied
      and no transfer record may be created.
    category: authorization/security
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Read and validate mTLS client subject for the request.
      - Permit transfer creation only if subject is allowlisted.
      - Deny request when subject is absent or not allowlisted.
      - Prevent transfer record creation on denied request.
    candidate_evidence:
      - mTLS subject in request context.
      - Allowlist lookup result.
      - Transfer creation response and persistence log.
    reason_it_is_in_scope: >
      Service-to-service authorization with explicit negative path and persistence
      side-effect constraint.

  - requirement_id: R011
    text: >
      Application logs must never contain a full account number; if an account
      number is logged, only the last four digits may remain visible.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect logged account number fields.
      - Prevent full account number from appearing in log output.
      - Preserve at most the last four digits when masking is applied.
    candidate_evidence:
      - Structured log entries.
      - Example payloads written to logger.
      - Masking output comparison.
    reason_it_is_in_scope: >
      Simple but non-trivial data-protection rule with precise forbidden output and
      observable log evidence.

  - requirement_id: R012
    text: >
      Every payment status change must append an audit event containing payment ID,
      old status, new status, actor ID, and event timestamp.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Emit an audit event for each payment status change.
      - Include payment ID in the event.
      - Include old and new status values.
      - Include actor ID and timestamp.
    candidate_evidence:
      - Audit event stream.
      - Payment state transition history.
      - Event schema validation result.
    reason_it_is_in_scope: >
      Multi-field audit requirement with deterministic presence checks and state
      transition linkage.

  - requirement_id: R013
    text: >
      Secret values from environment variables or secret-manager lookups must not
      be written to application logs even when an exception occurs.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Prevent secret values from appearing in normal logs.
      - Prevent secret values from appearing in exception logs.
      - Preserve logging behavior without leaking secret contents.
    candidate_evidence:
      - Normal execution logs.
      - Exception trace or error logs.
      - Secret fixture values used in test run.
    reason_it_is_in_scope: >
      Negative logging constraint with exception-sensitive branch and clear string
      evidence.

  - requirement_id: R014
    text: >
      A denied approval attempt caused by insufficient permission must create a
      security audit event containing actor ID, payment ID, reason code, and
      timestamp.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect denial caused by insufficient permission.
      - Emit a security audit event for that denial.
      - Include actor ID, payment ID, and reason code.
      - Include event timestamp.
    candidate_evidence:
      - Denied approval response.
      - Security audit log entry.
      - Event schema fields.
    reason_it_is_in_scope: >
      Security logging rule with conditional trigger and fixed evidence fields.

  - requirement_id: R016
    text: >
      A document-download token must expire 15 minutes after issuance; requests
      using an expired token must return `410` and must append a token-expired
      audit event.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Enforce 15-minute token lifetime from issuance time.
      - Return `410` when an expired token is used.
      - Append a token-expired audit event for the denied access.
    candidate_evidence:
      - Token issuance timestamp.
      - Download response code after expiry.
      - Audit log entry for expired-token access.
    reason_it_is_in_scope: >
      Time-based access rule with response and audit side effects that are easy to
      observe.

  - requirement_id: R018
    text: >
      Every reconciliation report download must append an audit record containing
      requester ID, applied filters, row count, and generation timestamp.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Emit an audit record for each reconciliation report download.
      - Include requester ID and applied filters.
      - Include row count and generation timestamp.
    candidate_evidence:
      - Download audit records.
      - Report generation request payload.
      - Generated report metadata.
    reason_it_is_in_scope: >
      Audit completeness requirement with multiple named evidence fields.

  - requirement_id: R019
    text: >
      Search logs for customer-email lookups must store only a salted hash of the
      search term and must never store the raw email string.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Transform email search term to salted hash before logging.
      - Prevent raw email string from appearing in search logs.
    candidate_evidence:
      - Search log entries.
      - Hashing function output for test input.
      - Raw email fixture used in request.
    reason_it_is_in_scope: >
      Deterministic data-protection rule with precise expected and forbidden log
      content.

  - requirement_id: R020
    text: >
      Both successful and denied reads of the payment-provider configuration must
      append an audit event containing actor ID, outcome, and configuration name.
    category: data protection/logging
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Emit audit event for successful configuration read.
      - Emit audit event for denied configuration read.
      - Include actor ID, outcome, and configuration name in each event.
    candidate_evidence:
      - Audit log entries for allowed and denied reads.
      - Configuration-read responses.
      - Event field validation.
    reason_it_is_in_scope: >
      Symmetric success/failure audit rule useful for negative controls and denial
      observability.

  - requirement_id: R021
    text: >
      A payment-create request must be rejected unless `amount` is greater than 0
      and less than or equal to 100000.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Require `amount > 0`.
      - Require `amount <= 100000`.
      - Reject request if either bound is violated.
    candidate_evidence:
      - Request payloads near lower and upper bounds.
      - Create-payment responses.
      - Persisted payment presence or absence.
    reason_it_is_in_scope: >
      Clear numeric validation with strong positive and negative boundary cases.

  - requirement_id: R024
    text: >
      A scheduled payment date must not be earlier than the request date and must
      not be more than 30 calendar days after the request date.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Reject scheduled date before request date.
      - Reject scheduled date more than 30 calendar days after request date.
      - Accept scheduled date within the allowed window.
    candidate_evidence:
      - Request timestamps and scheduled dates.
      - Validation responses.
      - Stored scheduled payment record for accepted case.
    reason_it_is_in_scope: >
      Temporal validation with two boundary checks and deterministic inputs.

  - requirement_id: R025
    text: >
      A rejection decision must include a comment between 10 and 500 characters;
      approval decisions must not require that comment.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Require comment when decision type is rejection.
      - Enforce minimum length of 10 for rejection comment.
      - Enforce maximum length of 500 for rejection comment.
      - Do not require comment for approval decisions.
    candidate_evidence:
      - Decision request payloads.
      - Validation responses for approval and rejection.
      - Recorded decision outcomes.
    reason_it_is_in_scope: >
      Conditional validation rule with branch-sensitive requirement and numeric
      bounds.

  - requirement_id: R026
    text: >
      A beneficiary bank update request must include either an IBAN or both an
      account number and routing number, but it must not include both forms at the
      same time.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Accept request containing IBAN only.
      - Accept request containing account number plus routing number only.
      - Reject request containing neither valid form.
      - Reject request containing both forms simultaneously.
    candidate_evidence:
      - Update request payloads.
      - Validation responses.
      - Beneficiary record update result.
    reason_it_is_in_scope: >
      Exclusive-or validation pattern with multiple structured positive and negative
      cases.

  - requirement_id: R027
    text: >
      Attachment upload for a payment request must accept only `pdf` or `png`
      files no larger than 5 MB.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Accept file type `pdf`.
      - Accept file type `png`.
      - Reject any other file type.
      - Reject file larger than 5 MB.
    candidate_evidence:
      - Upload request metadata.
      - Validation response for allowed and disallowed uploads.
      - Attachment persistence result.
    reason_it_is_in_scope: >
      Multi-attribute input constraint with content-type and size boundaries.

  - requirement_id: R028
    text: >
      A batch payout request must contain between 1 and 100 items, and all
      `client_reference` values within the batch must be unique.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Require at least 1 batch item.
      - Require at most 100 batch items.
      - Ensure all `client_reference` values are unique within the batch.
    candidate_evidence:
      - Batch request payload size.
      - Duplicate reference detection result.
      - Create-batch response and persisted batch state.
    reason_it_is_in_scope: >
      Collection validation with cardinality and uniqueness checks.

  - requirement_id: R029
    text: >
      A callback URL for asynchronous payment updates must use `https` and its
      hostname must be on the tenant allowlist.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Require URL scheme `https`.
      - Require callback hostname to be allowlisted for the tenant.
      - Reject callback configuration otherwise.
    candidate_evidence:
      - Callback configuration payload.
      - Tenant allowlist record.
      - Validation response.
    reason_it_is_in_scope: >
      Security-relevant input validation with string parsing and allowlist lookup.

  - requirement_id: R030
    text: >
      A refund request amount must not exceed the captured amount minus all prior
      approved refunds for that payment.
    category: validation/input constraints
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Read captured amount for the payment.
      - Sum prior approved refunds.
      - Reject refund request if requested amount exceeds remaining refundable
        balance.
    candidate_evidence:
      - Payment captured amount record.
      - Prior refund records.
      - Refund response and persisted refund state.
    reason_it_is_in_scope: >
      Numeric invariant over related records with clear positive and negative test
      variants.

  - requirement_id: R031
    text: >
      A payment may move from `DRAFT` to `SUBMITTED` only if it has at least one
      line item and the beneficiary record is verified.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Check current payment status is `DRAFT`.
      - Require at least one line item.
      - Require verified beneficiary record.
      - Allow transition to `SUBMITTED` only when all conditions hold.
    candidate_evidence:
      - Payment status and line-item records.
      - Beneficiary verification flag.
      - Transition response and updated payment state.
    reason_it_is_in_scope: >
      Classic state-transition invariant with multiple preconditions and explicit
      next state.

  - requirement_id: R032
    text: >
      A `SUBMITTED` payment may transition to `APPROVED` only after the required
      approver count for that payment type has been reached.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Check payment is currently `SUBMITTED`.
      - Read required approver count for the payment type.
      - Confirm recorded approvals meet or exceed that count.
      - Block transition to `APPROVED` otherwise.
    candidate_evidence:
      - Payment state record.
      - Payment-type approval policy.
      - Approval history and transition response.
    reason_it_is_in_scope: >
      State invariant tied to policy-derived threshold and approval history.

  - requirement_id: R033
    text: >
      Once a payment reaches `EXECUTED`, no mutable field except
      `reconciliation_note` may be changed.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect payment is in `EXECUTED` state.
      - Permit updates to `reconciliation_note`.
      - Reject updates to any other mutable field.
    candidate_evidence:
      - Payment state before update attempt.
      - Update payload showing targeted fields.
      - Response and post-update record.
    reason_it_is_in_scope: >
      Explicit post-terminal immutability rule with one narrow exception.

  - requirement_id: R034
    text: >
      Rejecting a payment must set status to `REJECTED` and clear any scheduled
      execution timestamp.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Set payment status to `REJECTED` on rejection.
      - Clear scheduled execution timestamp on rejection.
    candidate_evidence:
      - Payment record before and after rejection.
      - Rejection decision event.
      - Scheduled execution field value.
    reason_it_is_in_scope: >
      Direct state-effect requirement with two observable postconditions.

  - requirement_id: R036
    text: >
      A payment may be canceled only from `DRAFT` or `SUBMITTED`; a cancel request
      for `APPROVED` or `EXECUTED` must return `409` and leave status unchanged.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Allow cancel from `DRAFT`.
      - Allow cancel from `SUBMITTED`.
      - Return `409` for cancel from `APPROVED` or `EXECUTED`.
      - Preserve status unchanged on rejected cancel.
    candidate_evidence:
      - Payment status and cancel request.
      - Cancel response codes.
      - Payment state before and after request.
    reason_it_is_in_scope: >
      State machine rule with positive and negative branches plus explicit response.

  - requirement_id: R037
    text: >
      If a delegation window expires while a delegated approval task is still
      pending, that delegated task must become invalid and an expiration event must
      be emitted.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect pending delegated approval past delegation expiry.
      - Mark delegated task invalid.
      - Emit delegation-expired event.
    candidate_evidence:
      - Delegated task record with expiry time.
      - Task state after expiry processing.
      - Expiration event log.
    reason_it_is_in_scope: >
      Time-based state transition with explicit event side effect and clear pending
      task behavior.

  - requirement_id: R038
    text: >
      Opening a chargeback on a captured payment must set `dispute_status` to
      `OPEN` and must block creation of further refunds until the dispute is
      resolved.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Set `dispute_status` to `OPEN` when chargeback is opened.
      - Block new refund creation while dispute remains open.
    candidate_evidence:
      - Payment dispute status.
      - Chargeback event.
      - Refund-create response during open dispute.
    reason_it_is_in_scope: >
      Business invariant with explicit state mutation and downstream operation ban.

  - requirement_id: R040
    text: >
      A partially refunded payment must remain in `CAPTURED` status until the sum
      of approved refunds equals the captured amount; only then may status become
      `REFUNDED`.
    category: state transitions/business invariants
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Keep status `CAPTURED` when approved refunds total less than captured amount.
      - Permit status `REFUNDED` only when approved refunds exactly equal captured
        amount.
    candidate_evidence:
      - Payment captured amount.
      - Approved refund totals over time.
      - Payment status history.
    reason_it_is_in_scope: >
      Aggregate business invariant with numeric threshold driving state transition.

  - requirement_id: R041
    text: >
      Repeating a create-payment request with the same idempotency key and the same
      request body must return the original payment ID and must not create a second
      payment record.
    category: reliability/idempotency
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Match repeat request on same idempotency key.
      - Confirm request body is identical.
      - Return original payment ID.
      - Prevent creation of duplicate payment record.
    candidate_evidence:
      - Request headers and bodies.
      - Response payloads across repeated calls.
      - Payment table row count for that key.
    reason_it_is_in_scope: >
      Strong idempotency rule with identity and persistence guarantees.

  - requirement_id: R042
    text: >
      Reusing an idempotency key with a different request body must return `409`
      and must not create or modify any payment record.
    category: reliability/idempotency
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect reused idempotency key with non-identical body.
      - Return `409`.
      - Prevent payment creation or modification.
    candidate_evidence:
      - Original and repeated request bodies.
      - Conflict response code.
      - Payment persistence state before and after second request.
    reason_it_is_in_scope: >
      Negative idempotency branch with explicit response and non-mutation outcome.

  - requirement_id: R043
    text: >
      Retrying the same approval command after a client timeout must not record a
      duplicate approval action for the same approver and payment.
    category: reliability/idempotency
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Recognize repeated approval command for same approver and payment.
      - Prevent duplicate approval action record.
      - Preserve single effective approval outcome.
    candidate_evidence:
      - Approval command IDs or replay markers.
      - Approval history table.
      - Response or retry handling log.
    reason_it_is_in_scope: >
      Retry-safe approval rule with explicit duplicate suppression requirement.

  - requirement_id: R044
    text: >
      The ledger-posting consumer must ignore a duplicate provider message ID and
      must append a `duplicate_ignored` event.
    category: reliability/idempotency
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Detect duplicate provider message ID.
      - Suppress duplicate ledger posting.
      - Append `duplicate_ignored` event.
    candidate_evidence:
      - Consumer input messages.
      - Ledger posting records.
      - Event log showing duplicate handling.
    reason_it_is_in_scope: >
      Message-level idempotency with both non-action and required observability.

  - requirement_id: R045
    text: >
      Webhook delivery retries may occur on `5xx` responses up to three attempts,
      and retries must stop immediately after the first successful delivery.
    category: reliability/idempotency
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Retry on `5xx` delivery response.
      - Limit total attempts to three.
      - Stop retrying after first success.
    candidate_evidence:
      - Delivery attempt log with response codes.
      - Retry scheduler state.
      - Final delivery outcome record.
    reason_it_is_in_scope: >
      Controlled retry policy with bounded count and stop condition.

  - requirement_id: R046
    text: >
      Restarting an export job after a worker crash must resume under the same
      job ID and must not duplicate output rows already written.
    category: reliability/idempotency
    source_type: NEW_SYNTHETIC
    source_reference: null
    candidate_obligations:
      - Preserve same job ID across crash recovery.
      - Resume job after crash.
      - Prevent duplicate output rows already written before restart.
    candidate_evidence:
      - Job metadata before and after restart.
      - Crash and recovery logs.
      - Exported row set with duplicate check.
    reason_it_is_in_scope: >
      Recovery invariant with durable identifier and output-dedup requirement.

  - requirement_id: R047
    text: >
      If a payout executor lock remains stale for more than five minutes, exactly
