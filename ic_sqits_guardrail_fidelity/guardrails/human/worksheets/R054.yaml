  requirement_id: R054
  actor: execution job lifecycle logic
  precondition: execution job begins
  action: emit a structured start event
  expected_response_or_event: start event appears for the job
  required_state_effect: structured start event emitted
  forbidden_state_effect: execution job starting without start event
  exception: none stated
