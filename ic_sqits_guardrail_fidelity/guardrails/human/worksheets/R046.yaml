  requirement_id: R046
  actor: export job recovery logic
  precondition: worker crash occurs and export job is restarted
  action: resume under the same job ID
  expected_response_or_event: restarted job uses original job ID
  required_state_effect: job identity preserved across recovery
  forbidden_state_effect: new job ID assigned to restarted instance
  exception: none stated
  evidence_needed: job metadata before and after restart; crash and recovery logs
