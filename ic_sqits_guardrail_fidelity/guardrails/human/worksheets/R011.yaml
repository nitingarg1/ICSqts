worksheet_id: H_R011
requirement_id: R011
requirement_text: 'Application logs must never contain a full account number; if an
  account number is logged, only the last four digits may remain visible.

  '
category: data protection/logging
source_checklist_path: requirements/obligation_checklists/FINAL/data_protection_logging.yaml
