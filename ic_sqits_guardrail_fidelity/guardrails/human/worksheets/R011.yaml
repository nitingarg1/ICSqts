obligations:
- obligation_id: R011_O1
  requirement_id: R011
  actor: application logger
  precondition: log output includes account number content
  action: prevent full account number from appearing
  expected_response_or_event: log output contains no full account number
  required_state_effect: none required by text
  forbidden_state_effect: exposure of full account number in logs
  exception: none stated
  evidence_needed: structured log entries; account-number fixtures; log content comparison
  why_this_obligation_is_required_by_the_text: Text says logs must never contain a
    full account number.
- obligation_id: R011_O2
  requirement_id: R011
  actor: application logger
  precondition: an account number is logged
  action: retain at most the last four digits
  expected_response_or_event: log output reveals at most last four digits of account
    number
  required_state_effect: none required by text
  forbidden_state_effect: visibility of more than the last four digits when account
    number is logged
  exception: none stated
  evidence_needed: masked log entries; field-level masking output
  why_this_obligation_is_required_by_the_text: Text explicitly limits visible portion
    to last four digits.
required_evidence:
