  requirement_id: R045
  actor: webhook delivery retry logic
  precondition: webhook delivery attempt receives `5xx` response
  action: may retry delivery
  expected_response_or_event: retry is permitted after `5xx` response
  required_state_effect: none stated
  forbidden_state_effect: none stated
  exception: max-attempt limit and success-stop rule handled separately
