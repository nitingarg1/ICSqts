  requirement_id: R045
  actor: webhook delivery retry logic
  precondition: a delivery attempt succeeds before max attempts are exhausted
  action: stop retrying immediately after first success
  expected_response_or_event: no further retry attempts occur after success
  required_state_effect: retry schedule ends after success
  forbidden_state_effect: retry attempts after first successful delivery
  exception: none stated
  evidence_needed: delivery attempt log with response codes; retry scheduler state
  why_this_obligation_is_required_by_the_text: Text says retries must stop immediately
    after the first successful delivery.
