worksheet_id: H_R013
requirement_id: R013
requirement_text: 'Secret values from environment variables or secret-manager lookups
  must not be written to application logs even when an exception occurs.

  '
category: data protection/logging
source_checklist_path: requirements/obligation_checklists/FINAL/data_protection_logging.yaml
